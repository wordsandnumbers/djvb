name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # for OIDC
  contents: read
  packages: read    # so GITHUB_TOKEN can fetch vbclient from GitHub Packages

env:
  AWS_REGION: us-west-2
  CLUSTER: djvb

jobs:
  build-server:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push djvb-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/djvb-server:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/djvb-server:latest
          secrets: |
            gh_pat=${{ secrets.GITHUB_TOKEN }}

  build-ui:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push djvb-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/djvb-ui:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/djvb-ui:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-server, build-ui]
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment for server
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service djvb-server \
            --force-new-deployment

      - name: Force new deployment for UI
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service djvb-ui \
            --force-new-deployment

      - name: Wait for stable
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services djvb-server djvb-ui
