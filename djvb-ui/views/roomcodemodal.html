      <ion-modal-view>
        <ion-header-bar class="bar bar-header bar-positive">
          <h1 class="title">Enter Your Room Code</h1>
          <button class="button button-clear button-primary" ng-click="vm.roomCodeModal.hide()">Cancel</button>
        </ion-header-bar>
        <ion-content class="padding">
          <div class="list">
            <label class="item item-input">
              <span class="input-label">Room Code</span>
              <input ng-model="vm.roomCode" type="text">
            </label>
            <button class="button button-full button-positive" ng-click="vm.joinRoom(vm.roomCode)">OK</button>
          </div>
        </ion-content>
      </ion-modal-view>
