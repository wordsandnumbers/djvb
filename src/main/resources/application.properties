spring.data.mongodb.uri=${MONGO_URI}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.threads.virtual.enabled=true
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=djvb-vbsongs
spring.ai.mcp.server.version=${MCP_SERVER_VERSION:0.0.1}
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
vb.organization=${VB_ORGANIZATION}
vb.fayeUrl=${VB_FAYE_URL:wss://app.lyricalsystems.com:30008/faye}
manager.name=${MANAGER_NAME}
manager.reconcileMs=${MANAGER_RECONCILE_MS:300000}
manager.eventLockTtlMs=${MANAGER_EVENT_LOCK_TTL_MS:15000}
faye.handshakeTimeoutMs=${FAYE_HANDSHAKE_TIMEOUT_MS:15000}
default.language=${DEFAULT_LANGUAGE:English}
digits.consumer.key=${DIGITS_CONSUMER_KEY:}
mcp.apiToken=${MCP_API_TOKEN:}
security.basic.enabled=false
server.session.timeout=${SERVER_SESSION_TIMEOUT:31557600}
server.compression.enabled=true
server.compression.mime-types=application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,application/x-font-truetype,image/jpeg
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
