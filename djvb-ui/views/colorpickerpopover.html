<ion-popover-view>
	<ion-header-bar>
		<h1 class="title">Pick a color</h1>
	</ion-header-bar>
	<ion-content class="text-center">
		<button ng-repeat="color in userColors" class="button button-small" title="Change user color" ng-style="{'background-color': color}" ng-click="setColor(color)"></button>
	</ion-content>
</ion-popover-view>
