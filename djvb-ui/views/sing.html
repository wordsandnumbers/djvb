<ion-view title="Sing">
    <ion-nav-buttons side="secondary">
	    <a class="button button-stable button-icon icon ion-ios-gear-outline" title="Settings"
	       ng-click="vm.showSettings()"></a>
    </ion-nav-buttons>
	<ion-content class="has-header">
		<div ng-if="vm.queues.length===0">
			<h4 class="text-center">You're not singing yet!</h4>
			<p class="text-center">
				<a href="#search" class="button button-stable icon-left ion-search">Search Songs</a>
			</p>
		</div>
		<ion-list ng-if="vm.queues[0].queued.length">
			<div class="item item-divider">
				Singing Next
			</div>
			<ion-item class="item-icon-right" ng-repeat="play in vm.queues[0].queued">
				{{play.title}}
				<p>{{play.artist}}</p>
			</ion-item>
		</ion-list>
		<ion-list ng-if="vm.queues.length">
			<div class="item item-divider">
				Your Song Queue
			</div>
			<ion-item class="item-icon-right" ng-repeat="play in vm.queues[0].queue" ng-click="vm.selectPlay(play)">
				{{play.title}}
				<p>{{play.artist}}</p>
				<button class="button button-clear button-stable button-icon icon ion-more"></button>
			</ion-item>
			<ion-item class="item-icon-right" ng-if="vm.queues[0].queue.length === 0">
				<p class="text-center">
					No songs in your queue! 
				</p>
			</ion-item>
		</ion-list>
	</ion-content>
</ion-view>
