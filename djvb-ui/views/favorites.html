<ion-view view-title="Favorites">
	<ion-content class="has-header">
		<div class="card" ng-if="vm.favorites.songs.length === 0">
			<div class="item item-text-wrap text-center">
				No favorites.
			</div>
		</div>
		<ion-list>
			<ion-item class="item-icon-right" ng-repeat="song in vm.favorites.songs track by $index" ng-click="vm.selectSong(song)">
				{{song.title}}
				<p>{{song.artist}}</p>
				<button class="button button-clear button-stable button-icon icon ion-more"></button>
			    <ion-delete-button class="ion-minus-circled" ng-click="">
			    </ion-delete-button>
			    <ion-reorder-button class="ion-navicon" on-reorder="">
			    </ion-reorder-button>
			</ion-item>
		</ion-list>
	</ion-content>
</ion-view>
