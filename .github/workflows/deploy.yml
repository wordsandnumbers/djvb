name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # for OIDC
  contents: read
  packages: read    # so GITHUB_TOKEN can fetch vbclient from GitHub Packages

env:
  AWS_REGION: us-west-2
  CLUSTER: djvb

jobs:
  build-server:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push djvb-server
        uses: docker/build-push-action@v6
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/djvb-server:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/djvb-server:latest
          cache-from: type=gha,scope=djvb-server
          cache-to: type=gha,mode=max,scope=djvb-server
          secret-envs: |
            gh_pat=GH_PACKAGES_TOKEN

  build-ui:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push djvb-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/djvb-ui:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/djvb-ui:latest
          cache-from: type=gha,scope=djvb-ui
          cache-to: type=gha,mode=max,scope=djvb-ui

  deploy:
    runs-on: ubuntu-latest
    needs: [build-server, build-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy server
        run: ./.github/scripts/deploy-service.sh djvb-server "${{ needs.build-server.outputs.image_tag }}"

      - name: Deploy UI
        run: ./.github/scripts/deploy-service.sh djvb-ui "${{ needs.build-ui.outputs.image_tag }}"

      - name: Wait for stable
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services djvb-server djvb-ui
