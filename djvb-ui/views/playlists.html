<ion-view title="Playlists">
    <ion-nav-buttons side="secondary">
	    <button class="button button-icon icon ion-ios-plus-empty" title="Create Playlist"
	      ng-click="vm.newPlaylistPopup()"></button>
    </ion-nav-buttons>
	<ion-content class="has-header">
		<ion-list>
			<ion-item class="item-icon-right" ng-repeat="playlist in vm.playlists" href="#playlists/{{playlist.id}}">
				{{playlist.name}}
				<span class="badge badge-calm">{{playlist.songs.length}}</span>
			</ion-item>
		</ion-list>
	</ion-content>
</ion-view>
