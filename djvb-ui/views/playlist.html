<ion-view view-title="{{vm.playlist.name}}">
	<ion-content class="has-header has-footer">
		<ion-list>
			<ion-item class="item-icon-right" ng-repeat="song in vm.playlist.songs" ng-click="vm.selectSong(song)">
				{{song.title}}
				<p>{{song.artist}}</p>
			</ion-item>
		</ion-list>
	</ion-content>
</ion-view>
