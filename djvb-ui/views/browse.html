<ion-view>
	<ion-nav-title>{{vm.title}}</ion-nav-title>
    <!--<ion-nav-buttons side="right">
        <button class="button button-clear" ng-click="vm.filterSearch()"><i class="icon ion-ios-list"></i></button>
    </ion-nav-buttons>-->
    <ion-content class="has-header">
        <ion-list ng-if="vm.searchResults.songs && vm.searchResults.by==='popularity'">
	        <ion-item class="item-button-right" ng-repeat="song in vm.searchResults.songs" ng-click="vm.selectSong(song)">
	        	<h2><strong>{{$index + 1}}</strong> {{song.title}}</h2>
	        	<p>{{song.artist}}</p>
               	<p ng-if="song.tags">
               		<span class="icon" ng-class="{'ion-pricetags':song.tags.length>1,'ion-pricetag':song.tags.length===1}"></span>
               		<span ng-repeat="tag in song.tags">{{tag}}{{$last ? '' : ', '}}</span>
              	</p>
				<div class="buttons">
					<button class="button button-clear button-stable button-icon icon ion-more"></button>
				</div>
	        </ion-item>
        </ion-list>
        <ion-list ng-if="vm.searchResults.songs && vm.searchResults.by==='recently_added'">
             <div ng-repeat="(date, songs) in vm.songGroups | orderBy:'-date'">
                <ion-item class="item item-divider">
                    {{date | date:'MMMM d yyyy'}}
                </ion-item>
                <ion-item class="item-button-right" ng-repeat="song in songs" ng-click="vm.selectSong(song)">
		        	<h2>{{song.title}}</h2>
		        	<p>{{song.artist}}</p>
                	<p ng-if="song.tags">
                		<span class="icon" ng-class="{'ion-pricetags':song.tags.length>1,'ion-pricetag':song.tags.length===1}"></span>
                		<span ng-repeat="tag in song.tags">{{tag}}{{$last ? '' : ', '}}</span>
               		</p>
					<div class="buttons">
						<button class="button button-clear button-stable button-icon icon ion-more"></button>
					</div>
                </ion-item>
            </div>
        </ion-list>
        <ion-list ng-if="!vm.hasSongGroups()">
			<ion-item ng-if="vm.noResults">No results</ion-item>
        </ion-list>
		<ion-infinite-scroll on-infinite="vm.nextPage()" distance="1%" ng-if="vm.hasMoreData()">
		</ion-infinite-scroll>
    </ion-content>
</ion-view>
